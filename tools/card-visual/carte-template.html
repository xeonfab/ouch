<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700;900&display=swap');
  html,body{margin:0;width:1080px;height:1350px;background:#FFF2A8;font-family:Inter,system-ui,sans-serif;}
  .bg{position:absolute;inset:0;overflow:hidden}
  .dot{position:absolute;width:26px;height:26px;border:4px solid #111;}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px;box-sizing:border-box}
  .kicker{font-weight:900;font-size:34px;letter-spacing:.04em;text-transform:uppercase;color:#111;background:#B9F5D8;border:5px solid #111;padding:14px 26px;box-shadow:10px 10px 0 #111;margin-bottom:46px;transform:rotate(-2deg)}
  .card{width:900px;background:#fff;border:6px solid #111;box-shadow:18px 18px 0 #111;padding:52px 60px;box-sizing:border-box;position:relative}
  .emoji{font-size:110px;line-height:1;margin-bottom:26px}
  .quote{font-family:'Archivo Black',Inter,sans-serif;font-size:60px;line-height:1.14;color:#111;margin:0 0 40px}
  .quote span{background:#FFD400;padding:0 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .badge{border:4px solid #111;padding:10px 18px;font-weight:800;font-size:26px;background:#E9D8FF}
  .badge.hash{background:#fff}
  .cta{margin-top:44px;width:900px;background:#7C3AED;color:#fff;border:6px solid #111;box-shadow:14px 14px 0 #111;padding:36px 56px;box-sizing:border-box;font-size:44px;font-weight:900;line-height:1.2}
  .cta small{display:block;font-size:30px;font-weight:700;margin-top:16px;color:#FFF2A8}
  .foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-weight:800;font-size:28px;color:#111;opacity:.8}
</style></head><body>
<div class="bg">
  <div class="dot" style="left:60px;top:80px;background:#7C3AED;transform:rotate(15deg)"></div>
  <div class="dot" style="right:90px;top:140px;background:#B9F5D8;border-radius:50%"></div>
  <div class="dot" style="left:120px;bottom:160px;background:#FFD400;transform:rotate(30deg)"></div>
  <div class="dot" style="right:70px;bottom:260px;background:#7C3AED;border-radius:50%"></div>
  <div class="dot" style="left:980px;top:620px;background:#FFD400;transform:rotate(12deg)"></div>
</div>
<div class="wrap">
  <div class="kicker">Galère de freelance n°1</div>
  <div class="card">
    <div class="emoji">📨</div>
    <p class="quote">« <span>Chaque vendredi</span>, je perds trois heures à relancer mes factures impayées. »</p>
    <div class="meta"><span class="badge">Facturation</span><span class="badge hash">#RelanceFacture</span></div>
  </div>
  <div class="cta">Tu la vis aussi ? Swipe à droite. 🔥<small>20 secondes, pas de compte. La tienne n&#8217;y est pas ? Dépose-la, les autres freelances diront « moi aussi ».</small></div>
</div>
<div class="foot">lien en commentaire 👇</div>
</body></html>
